name: Analyze Shiva database

on:
  push:
    paths:
      - '.github/workflows/analyze-shiva.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect database for report inputs
        run: |
          python - <<'PY'
          import sqlite3, pathlib, json
          con=sqlite3.connect('shiva_draft_roi.sqlite')
          cur=con.cursor()
          out=[]
          tables=[r[0] for r in cur.execute("select name from sqlite_master where type='table' order by name")]
          for t in tables:
              cols=[r[1] for r in cur.execute(f'pragma table_info("{t}")')]
              n=cur.execute(f'select count(*) from "{t}"').fetchone()[0]
              out.append(f'{t}\t{n}\t'+','.join(cols))
          out.append('\nEND_ROSTER BY SEASON')
          for r in cur.execute("select season,count(distinct team_id),count(*),group_concat(distinct coalesce(acquisition_type,'NULL')) from end_rosters group by season order by cast(season as integer)"):
              out.append('\t'.join(map(str,r)))
          out.append('\nEND_ROSTER TEAM NAMES 2018-2025')
          for r in cur.execute("select season,team_id,team_name,manager_names,count(*) from end_rosters where cast(season as integer) between 2018 and 2025 group by season,team_id,team_name,manager_names order by cast(season as integer),cast(team_id as integer)"):
              out.append('\t'.join(map(str,r)))
          pathlib.Path('analysis').mkdir(exist_ok=True)
          pathlib.Path('analysis/report_input_catalog.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/report_input_catalog.txt
          git diff --cached --quiet || git commit -m "Catalog Shiva report inputs"
          git push
