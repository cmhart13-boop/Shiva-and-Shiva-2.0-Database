name: Analyze Shiva database

on:
  push:
    paths:
      - '.github/workflows/analyze-shiva.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild corrected blind model
        run: |
          python - <<'PY'
          import sqlite3, pathlib, csv, json, statistics
          from collections import defaultdict
          con=sqlite3.connect('shiva_draft_roi.sqlite'); cur=con.cursor()
          cols=[d[0] for d in cur.execute('select * from draft_roi_scores limit 1').description]
          picks=[dict(zip(cols,r)) for r in cur.execute('select * from draft_roi_scores').fetchall()]
          fcols=[d[0] for d in cur.execute('select * from draft_picks_full limit 1').description]
          full=[dict(zip(fcols,r)) for r in cur.execute('select * from draft_picks_full where season<=2025').fetchall()]
          ids={(int(r['league_id']),int(r['season']),int(r['team_id'])):(r['manager_names'],r['team_name']) for r in full}
          keys=sorted(ids); nteams=defaultdict(int)
          for k in keys: nteams[k[:2]]+=1
          lookup={(int(r['league_id']),int(r['season']),int(r['team_id']),int(r['overall_pick'])):r for r in picks}
          teamrows=defaultdict(list)
          for r in full:
              k=(int(r['league_id']),int(r['season']),int(r['team_id']))
              teamrows[k].append((int(r['round']),int(r['overall_pick']),r['position'],lookup.get((k[0],k[1],k[2],int(r['overall_pick'])))))
          baseR={'QB':12,'RB':30,'WR':36,'TE':12,'K':10,'D/ST':10,'DST':10}; games={2014:16,2015:16,2016:16,2017:16,2018:16,2019:16,2020:16,2021:17,2022:17,2023:17,2024:17,2025:17}
          by=defaultdict(list)
          for r in picks:
              if r['position'] in baseR and r['position_finish_total'] and r['fantasy_points_ppr'] is not None: by[(int(r['league_id']),int(r['season']),r['position'])].append(r)
          rep={}
          for (lg,s,p),a in by.items():
              R=max(1,round(baseR[p]*nteams[(lg,s)]/10)); near=sorted(a,key=lambda x:abs(int(x['position_finish_total'])-R))[:5]
              rep[(lg,s,p)]=statistics.median(float(x['fantasy_points_ppr']) for x in near)
          def util(r,ib=.25,rs=1.0):
              if not r or r['position'] not in baseR or r['fantasy_points_ppr'] is None:return 0.0
              lg,s,p=int(r['league_id']),int(r['season']),r['position']; rp=rep.get((lg,s,p),0)*rs; actual=max(0,float(r['fantasy_points_ppr'])-rp)
              gp=int(r['games_played'] or 0); ppg=float(r['ppg'] or 0); sg=games.get(s,17)
              if 8<=gp<sg and ppg>0:return (1-ib)*actual+ib*max(0,ppg*sg-rp)
              return actual
          def pct(d):
              out={}
              for ls in set(k[:2] for k in d):
                  a=sorted((v,k) for k,v in d.items() if k[:2]==ls); m=len(a); i=0
                  while i<m:
                      j=i
                      while j+1<m and a[j+1][0]==a[i][0]:j+=1
                      q=100*((i+j)/2)/(m-1) if m>1 else 50
                      for z in range(i,j+1):out[a[z][1]]=q
                      i=j+1
              return out
          def construct(k):
              q=[];te=[]; kk=[];dd=[]; pen=0
              for rd,op,p,r in sorted(teamrows[k]):
                  fin=int(r['position_finish_total']) if r and r['position_finish_total'] else 999
                  if p=='QB':q.append((rd,fin))
                  elif p=='TE':te.append((rd,fin))
                  elif p=='K':kk.append(rd)
                  elif p in ('D/ST','DST'):dd.append(rd)
              for i,(rd,fin) in enumerate(q[1:],2):
                  if not (i==2 and fin<=12) and not (i>=3 and fin<=10):pen+=max(0,13-rd)*.7
              for i,(rd,fin) in enumerate(te[1:],2):
                  if not (i==2 and fin<=6):pen+=max(0,12-rd)*.55
              for i,rd in enumerate(kk,1): pen += (max(0,13-rd)*.8 if i==1 else 4)
              for i,rd in enumerate(dd,1): pen += (max(0,10-rd)*.6 if i==1 else (2.5 if rd<13 else 0))
              return -pen
          def components(ib=.25,rs=1.0):
              U={}; pools=defaultdict(list)
              for k,a in teamrows.items():
                  for rd,op,p,r in a:
                      u=util(r,ib,rs); U[(k,op)]=u; pools[(k[0],k[1],rd)].append(u)
              exp={g:statistics.mean(v) for g,v in pools.items()}
              # empirically derived round importance = expected usable value in that round relative to season's round average; clipped for stability
              rw={}
              for ls in set((g[0],g[1]) for g in exp):
                  vals=[v for g,v in exp.items() if g[:2]==ls]; mean=statistics.mean(vals) or 1
                  for g,v in exp.items():
                      if g[:2]==ls: rw[g]=min(2.25,max(.30,v/mean))
              P={};E={};C={}
              for k,a in teamrows.items():
                  P[k]=sum(U[(k,op)] for rd,op,p,r in a)
                  E[k]=sum((U[(k,op)]-exp[(k[0],k[1],rd)])*rw[(k[0],k[1],rd)] for rd,op,p,r in a)
                  C[k]=construct(k)
              return pct(P),pct(E),pct(C),rw
          P,E,C,rw=components()
          outcomes={}
          for s,tid,pf in cur.execute("select season,team_id,points_for from teams_standings where cast(season as integer) between 2018 and 2025"):
              outcomes[(1465338,int(s),int(tid))]=float(pf)
          pfr={}
          for s in range(2018,2026):
              a=sorted([(pf,k) for k,pf in outcomes.items() if k[1]==s],reverse=True)
              for i,(pf,k) in enumerate(a,1):pfr[k]=i
          def spear(sc):
              a=[(sc[k],-pfr[k]) for k in pfr if k in sc]
              def rank(v):
                  o=sorted(range(len(v)),key=lambda i:v[i]); r=[0]*len(v); i=0
                  while i<len(o):
                      j=i
                      while j+1<len(o) and v[o[j+1]]==v[o[i]]:j+=1
                      z=(i+j+2)/2
                      for q in range(i,j+1):r[o[q]]=z
                      i=j+1
                  return r
              x,y=rank([z[0] for z in a]),rank([z[1] for z in a]); mx=statistics.mean(x);my=statistics.mean(y)
              return sum((u-mx)*(v-my) for u,v in zip(x,y))/(sum((u-mx)**2 for u in x)*sum((v-my)**2 for v in y))**.5
          cand=[(55,35,10),(60,30,10),(65,25,10),(55,30,15),(60,35,5),(50,40,10)]
          val=[]
          for w in cand:
              sc={k:(w[0]*P[k]+w[1]*E[k]+w[2]*C[k])/100 for k in keys}; top=[sc[k] for k in pfr if pfr[k]<=4]; bot=[sc[k] for k in pfr if pfr[k]>4]
              val.append({'weights':w,'spearman':spear(sc),'top4_gap':statistics.mean(top)-statistics.mean(bot)})
          best=max(val,key=lambda d:d['spearman']+.01*d['top4_gap']); W=tuple(best['weights']); final={k:(W[0]*P[k]+W[1]*E[k]+W[2]*C[k])/100 for k in keys}
          vars=[]
          for ib in (.15,.25,.35):
              for rs in (.9,1,1.1):
                  p,e,c,_=components(ib,rs)
                  for w in [(55,35,10),(60,30,10),(65,25,10),(55,30,15),(60,35,5)]:vars.append({k:(w[0]*p[k]+w[1]*e[k]+w[2]*c[k])/100 for k in keys})
          vr=[]
          for sc in vars:
              oo=sorted(keys,key=lambda k:sc[k],reverse=True);vr.append({k:i+1 for i,k in enumerate(oo)})
          # Blind final order. Exact score ties use median sensitivity rank, still identity-free.
          med={k:statistics.median(r[k] for r in vr) for k in keys}; order=sorted(keys,key=lambda k:(-final[k],med[k],k))
          res=[]
          for i,k in enumerate(order,1):
              rr=[r[k] for r in vr];mgr,team=ids[k]
              res.append({'rank':i,'league':'Shiva' if k[0]==1465338 else 'Shiva 2.0','season':k[1],'team_id':k[2],'manager':mgr,'team':team,'score':round(final[k],2),'portfolio_pct':round(P[k],2),'capital_efficiency_pct':round(E[k],2),'construction_pct':round(C[k],2),'sensitivity_median_rank':round(med[k],1),'sensitivity_best_rank':min(rr),'sensitivity_worst_rank':max(rr),'top25_frequency':round(100*sum(x<=25 for x in rr)/len(rr),1)})
          summary={'team_drafts':len(keys),'graded_picks':len(picks),'weights':{'portfolio':W[0],'capital_efficiency':W[1],'construction':W[2]},'validation':val,'selected':best,'sensitivity_variants':len(vars),'draft_contribution_context':{'all_teams':80.02,'top4_scorers':80.12,'champions':76.49,'known_player_coverage':63.6},'method':'Blind. Portfolio is usable VORP-like production. Capital efficiency is pick utility minus same-season/same-round expectation, multiplied by empirically observed round importance, so early misses/hits carry greater opportunity-cost weight without hardcoding round weights. Construction is a light wasted-capital penalty. Identities joined after scores/ranks frozen.'}
          pathlib.Path('analysis').mkdir(exist_ok=True)
          for name,data in [('blind_v2_all214.csv',res),('blind_v2_top35.csv',res[:35]),('blind_v2_boundary20_40.csv',[r for r in res if 20<=r['rank']<=40])]:
              with open('analysis/'+name,'w',newline='',encoding='utf-8') as f:w=csv.DictWriter(f,fieldnames=res[0].keys());w.writeheader();w.writerows(data)
          pathlib.Path('analysis/blind_v2_summary.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          md=['# Blind Shiva Draft Model v2 — Final Top 35','',summary['method'],'',f"Weights: Portfolio {W[0]}% / Capital efficiency {W[1]}% / Construction {W[2]}%",f"Validation Spearman vs better regular-season PF rank: {best['spearman']:.3f}",f"Top-4 scoring draft-score gap: {best['top4_gap']:.2f}",f"Sensitivity variants: {len(vars)}",'','|#|Manager|Year|League|Score|Portfolio|Capital Eff.|Median Sens.|Range|Top25 Freq.|','|---:|---|---:|---|---:|---:|---:|---:|---:|---:|']
          for r in res[:35]:md.append(f"|{r['rank']}|{r['manager']}|{r['season']}|{r['league']}|{r['score']:.2f}|{r['portfolio_pct']:.1f}|{r['capital_efficiency_pct']:.1f}|{r['sensitivity_median_rank']}|{r['sensitivity_best_rank']}-{r['sensitivity_worst_rank']}|{r['top25_frequency']}%|")
          pathlib.Path('analysis/blind_v2_top35_report.md').write_text('\n'.join(md),encoding='utf-8')
          PY
      - name: Commit corrected results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/blind_v2_*.csv analysis/blind_v2_*.json analysis/blind_v2_*.md
          git diff --cached --quiet || git commit -m "Generate corrected blind draft model v2"
          git push
