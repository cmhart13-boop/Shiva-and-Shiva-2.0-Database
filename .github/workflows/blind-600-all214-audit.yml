name: Blind 600 All214 Draft Audit
on:
  push:
    paths:
      - '.github/workflows/blind-600-all214-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run 600 blind trials across all 214 drafts
        run: |
          python - <<'PY'
          import pathlib
          src=pathlib.Path('.github/workflows/blind-250-audit.yml').read_text()
          marker="          python - <<'PY'\n"
          start=src.index(marker)+len(marker)
          end=src.index("\n          PY",start)
          block=src[start:end]
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          script=script.replace('NTRIALS=250','NTRIALS=600')
          script=script.replace('blind_250_','blind_600_all214_')
          script=script.replace('250 deterministic-seed','600 deterministic-seed')
          script=script.replace('250 blind rank distributions','600 blind rank distributions')
          script=script.replace('250 blind trials','600 blind trials')
          script=script.replace('# Blind 250-Trial Shiva Draft Stability Audit','# Blind 600-Trial All-214 Shiva Draft Stability Audit')
          exec(compile(script,'blind_600_all214_generated.py','exec'))
          PY
      - name: Verify expected outputs
        run: |
          test -s analysis/blind_600_all214_all214.csv
          test -s analysis/blind_600_all214_top35.csv
          test -s analysis/blind_600_all214_parameters.csv
          test -s analysis/blind_600_all214_boundary_audit.json
          test -s analysis/blind_600_all214_summary.json
          test -s analysis/blind_600_all214_report.md
          python - <<'PY'
          import csv, json
          rows=list(csv.DictReader(open('analysis/blind_600_all214_all214.csv', encoding='utf-8')))
          params=list(csv.DictReader(open('analysis/blind_600_all214_parameters.csv', encoding='utf-8')))
          assert len(rows)==214, len(rows)
          assert len(params)==600, len(params)
          assert [int(r['consensus_rank']) for r in rows]==list(range(1,215))
          s=json.load(open('analysis/blind_600_all214_summary.json', encoding='utf-8'))
          assert s['trials']==600, s
          assert s['drafts']==214, s
          print('AUDIT_OK drafts=',len(rows),'trials=',len(params),'rank1=',rows[0]['manager'],rows[0]['season'],rows[0]['league'])
          PY
      - name: Upload 600-trial audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: blind-600-all214-results
          path: analysis/blind_600_all214_*
          if-no-files-found: error
