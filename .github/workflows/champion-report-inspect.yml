name: Champion report inspect
on:
  push:
    branches:
      - analysis/champion-report-20260906
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect SQLite database
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3, json
          con=sqlite3.connect('shiva_draft_roi.sqlite')
          cur=con.cursor()
          print('=== TABLES ===')
          tables=[r[0] for r in cur.execute("select name from sqlite_master where type='table' order by name")]
          print(json.dumps(tables))
          for t in tables:
              print(f'=== SCHEMA {t} ===')
              print(json.dumps(cur.execute(f'pragma table_info({t})').fetchall()))
              print(f'=== COUNT {t} ===')
              print(cur.execute(f'select count(*) from {t}').fetchone()[0])
          print('=== DRAFT_ROI_SAMPLE ===')
          try:
              cols=[r[1] for r in cur.execute('pragma table_info(draft_roi_scores)').fetchall()]
              print(json.dumps(cols))
              for row in cur.execute('select * from draft_roi_scores limit 10'):
                  print(json.dumps(dict(zip(cols,row)), default=str))
              for c in ['league','league_name','season','year','manager','owner','team','finish','final_rank','draft_round','round','pick','player_name','position']:
                  if c in cols:
                      vals=cur.execute(f'select {c}, count(*) from draft_roi_scores group by {c} order by {c} limit 200').fetchall()
                      print(f'=== UNIQUE {c} ===')
                      print(json.dumps(vals, default=str))
          except Exception as e:
              print('ERROR',repr(e))
          con.close()
          PY
